"സൗരയൂഥത്തിൽ എത്ര ഗ്രഹങ്ങൾ?|എട്ട്",
"പൂക്കളിൽ നിന്ന് തേൻ ശേഖരിക്കുന്നത്?|തേനീച്ച",
"പൂമ്പാറ്റ ആദ്യം എന്തായിരുന്നു?|പുഴു (ലാർവ)",
"ഓണത്തിന് മുറ്റത്തൊരുക്കുന്നത്?|പൂക്കളം",
"ഓണത്തിന് വരുന്നതായി വിശ്വസിക്കുന്ന രാജാവ്?|മഹാബലി",
"ക്രിക്കറ്റ് ടീമിൽ എത്ര കളിക്കാർ?|11",
"ഒളിമ്പിക്സ് ചിഹ്നത്തിൽ എത്ര വളയങ്ങൾ?|അഞ്ച്",
"കടലാസ് ഉണ്ടാക്കുന്നത് എന്തിൽ നിന്ന്?|മരം",
"ബഹിരാകാശത്തു പോയ ആദ്യ ഇന്ത്യക്കാരൻ?|രാകേഷ് ശർമ്മ",
"ചന്ദ്രയാൻ-3 ചന്ദ്രനിൽ ഇറങ്ങിയ വർഷം?|2023",
"തേങ്ങ കിട്ടുന്ന മരം?|തെങ്ങ്",
"മഴക്കാലത്ത് ചൂടാൻ ഉപയോഗിക്കുന്നത്?|കുട"]};
const all=[];let k=1;
for(const c in D)D[c].forEach(s=>{const i=s.indexOf('|');all.push({n:k++,c,q:s.slice(0,i),a:s.slice(i+1)})});
let cat='എല്ലാം',term='',order=all.slice();
const $=id=>document.getElementById(id);
function chips(){
 $('cats').innerHTML=['എല്ലാം',...Object.keys(D)].map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}">${c}</button>`).join('');
 $('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();render()});
}
function render(){
 const r=order.filter(x=>(cat==='എല്ലാം'||x.c===cat)&&(x.q+x.a).includes(term));
 $('c').textContent=r.length+' ചോദ്യങ്ങൾ';
 $('list').innerHTML=r.map(x=>`<div class="q"><div class="t"><span class="n">${x.n}</span><span>${x.q}</span></div><div class="a">✅ ${x.a}</div></div>`).join('');
 $('list').querySelectorAll('.q').forEach(e=>e.onclick=()=>e.classList.toggle('open'));
}
$('s').oninput=e=>{term=e.target.value.trim();render()};
$('all').onclick=()=>{const q=[...document.querySelectorAll('.q')];const open=q.some(e=>!e.classList.contains('open'));q.forEach(e=>e.classList.toggle('open',open));$('all').textContent=open?'ഉത്തരങ്ങൾ മറയ്ക്കുക':'എല്ലാ ഉത്തരങ്ങളും കാണിക്കുക'};
$('shuf').onclick=()=>{order=order.slice().sort(()=>Math.random()-.5);render()};
chips();render();
</script>
</body>
</html>
